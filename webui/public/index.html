<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OPC 制作台 · 一键出片</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="dot" id="healthDot"></span>
    <strong>OPC 制作台</strong>
    <span class="muted">选题 → 脚本 → 成片 → 发布</span>
  </div>
  <nav class="tabs">
    <button class="tab active" data-view="console">控制台</button>
    <button class="tab" data-view="tutorial">使用教程</button>
    <button class="tab" data-view="about">架构/命令</button>
  </nav>
  <div class="global" id="globalStatus">正在连接…</div>
</header>

<main id="view-console" class="view">
  <aside class="side">
    <section class="panel">
      <div class="panel-head"><h2>能做什么</h2><span class="muted small">点击运行</span></div>
      <div id="pipelines" class="pipelines"></div>
    </section>

    <section class="panel">
      <div class="panel-head"><h2>历史运行</h2><button class="link" id="refreshRuns">刷新</button></div>
      <div id="runs" class="runs"></div>
    </section>
  </aside>

  <section class="main">
    <div id="runPanel" class="panel run-panel">
      <div class="empty">
        <div class="empty-icon">🎬</div>
        <h3>还没有在跑的任务</h3>
        <p class="muted">从左边选一个：<br>先「抓数据 + 选题」拿到当天题材，再「一键出片」。</p>
      </div>
    </div>
  </section>
</main>

<main id="view-tutorial" class="view doc hidden"><article id="tutorialBody" class="markdown"></article></main>
<main id="view-about" class="view doc hidden"><article id="aboutBody" class="markdown"></article></main>

<div id="modal" class="modal hidden">
  <div class="modal-box">
    <h3 id="modalTitle">确认</h3>
    <div id="modalBody"></div>
    <div class="modal-actions">
      <button class="btn ghost" id="modalCancel">取消</button>
      <button class="btn danger" id="modalOk" disabled>确认</button>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>
<script src="/app.js"></script>
</body>
</html>
